# Honors listed on /honors/ — entries render in the order they appear here, so put
# the most recent first.
#
# Fields (only `title` is required):
#   title    name of the honor
#   issuer   organization or institution that granted it
#   date     display string, e.g. "2026" or "Jul 2026" — quote it so YAML keeps it as text
#   url      link to the announcement, certificate, or list of recipients
#   summary  one line of context, e.g. selection rate or scope
#   image    filename, or a list of filenames, stored in assets/img/honor/.
#            e.g. `image: cert.jpg` or `image: [2022first.jpg, 2019first.jpg]`.
#            A .jpg/.png is shown as a picture under the entry; a .pdf falls back to a
#            "Certificate (PDF)" link, because browsers cannot render a PDF in an <img>.

- title: National Scholarship
  issuer: Ministry of Education, China
  image: 2022first.jpg

- title: Shanghai Outstanding Graduate
  issuer: Shanghai Municipal Education Commission

- title: First-Class Scholarship
  issuer: Zhejiang University

- title: First-Class Scholarship
  issuer: Tongji University
  summary: Awarded multiple times.

- title: Outstanding Student
  issuer: Tongji University
